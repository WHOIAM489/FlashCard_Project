<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainDeck — Deck Editor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-layer-group"></i>
        BrainDeck
      </a>
      <div style="display:flex;gap:8px;align-items:center;">
        <a href="index.html" class="btn btn-sm btn-outline"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a id="btnStudyTop" href="#" class="btn btn-sm btn-primary"><i class="fa-solid fa-play"></i> Study</a>
        <a href="settings.html" class="settings-header-btn" title="ตั้งค่า"><i class="fa-solid fa-gear"></i></a>
        <div id="userBar"></div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 30px; padding-bottom: 60px;">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px;">
      <h1 class="page-title" id="deckTitle">Loading...</h1>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" id="btnAddCard"><i class="fa-solid fa-plus"></i> Add Card</button>
        <button class="btn btn-outline btn-sm" id="btnEditDeckName"><i class="fa-solid fa-pen"></i> Rename</button>
      </div>
    </div>
    <p class="page-subtitle" id="deckInfo"></p>

    <div id="cardContainer">
      <div class="loading"><i class="fa-solid fa-spinner"></i> กำลังโหลด...</div>
    </div>
  </main>

  <div id="modalRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/supabaseAuth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/settings.js"></script>
  <script>
    SupabaseAuth.requireAuth();
    SupabaseAuth.initUserBar();
  </script>
  <script src="js/editor.js"></script>
</body>
</html>
